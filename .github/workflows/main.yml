.github/workflows/main.yml
name: fabrica-de-mods
on:
  push:
    paths: ['src/**', 'resources/**', 'fabrica.properties']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar projeto (descobre versoes e gera o Gradle)
        id: prep
        run: |
          python3 - <<'PY'
          import os, re, json, glob, shutil, urllib.request, urllib.parse

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'mod-fabrica'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          props = {}
          if os.path.exists('fabrica.properties'):
              for line in open('fabrica.properties', encoding='utf-8'):
                  line = line.strip()
                  if line and not line.startswith('#') and '=' in line:
                      k, v = line.split('=', 1)
                      props[k.strip()] = v.strip()

          mc = props.get('minecraft', '1.21.1')
          ver = props.get('version', '1.0.0')
          loom = props.get('loom', '1.8-SNAPSHOT')
          gradle = props.get('gradle', '8.10.2')

          files = glob.glob('src/**/*.java', recursive=True)
          if not files:
              raise SystemExit('ERRO: nenhum arquivo .java encontrado na pasta src/')

          main_cls = client_cls = modid_const = None
          for f in files:
              t = open(f, encoding='utf-8').read()
              m = re.search(r'^\s*package\s+([\w.]+)\s*;', t, re.M)
              pkg = m.group(1) if m else ''
              parts_pkg = [p for p in pkg.split('.') if p]
              dest = os.path.join('out', 'src', 'main', 'java', *parts_pkg)
              os.makedirs(dest, exist_ok=True)
              shutil.copy(f, dest)
              tm = re.search(r'^(?:public\s+)?(?:final\s+)?(?:abstract\s+)?class\s+(\w+)', t, re.M)
              top = tm.group(1) if tm else os.path.splitext(os.path.basename(f))[0]
              base = pkg + '.' if pkg else ''
              for cm in re.finditer(r'class\s+(\w+)[^{;]*?\bimplements\s+([^{]+)\{', t):
                  name, impl = cm.group(1), cm.group(2)
                  fq = base + top + ('' if name == top else '$' + name)
                  if 'ClientModInitializer' in impl:
                      client_cls = fq
                  elif re.search(r'\bModInitializer\b', impl):
                      main_cls = fq
              if not modid_const:
                  mm = re.search(r'MOD_ID\s*=\s*"([a-z0-9_\-]+)"', t)
                  if mm:
                      modid_const = mm.group(1)

          if not main_cls and not client_cls:
              raise SystemExit('ERRO: nenhuma classe implementa ModInitializer / ClientModInitializer')

          modid = props.get('modid') or modid_const or (main_cls or client_cls).split('.')[-1].split('$')[0].lower()
          modid = re.sub(r'[^a-z0-9_]', '', modid.lower())
          name = props.get('name', modid)

          nums = [int(x) for x in re.findall(r'\d+', mc)][:3]
          nums += [0] * (3 - len(nums))
          java = props.get('java') or ('21' if tuple(nums) >= (1, 20, 5) else '17')

          yarns = get('https://meta.fabricmc.net/v2/versions/yarn/' + urllib.parse.quote(mc))
          if not yarns:
              raise SystemExit('ERRO: nao existe mapping Yarn para Minecraft ' + mc)
          yarn = max(yarns, key=lambda x: x['build'])['version']
          loaders = get('https://meta.fabricmc.net/v2/versions/loader')
          loader = next(l['version'] for l in loaders if l.get('stable'))

          q = urllib.parse.quote('["%s"]' % mc)
          lq = urllib.parse.quote('["fabric"]')
          vs = get('https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%s&loaders=%s' % (q, lq))
          if not vs:
              raise SystemExit('ERRO: Fabric API nao encontrada para Minecraft ' + mc)
          api_ver = vs[0]['version_number']
          api_file = next(x for x in vs[0]['files'] if x.get('primary')) if any(x.get('primary') for x in vs[0]['files']) else vs[0]['files'][0]

          # recursos opcionais
          res_out = os.path.join('out', 'src', 'main', 'resources')
          os.makedirs(res_out, exist_ok=True)
          if os.path.isdir('resources'):
              shutil.copytree('resources', res_out, dirs_exist_ok=True)
          fmj = os.path.join(res_out, 'fabric.mod.json')
          if os.path.exists(fmj):
              s = open(fmj, encoding='utf-8').read().replace('${version}', ver)
              open(fmj, 'w', encoding='utf-8').write(s)
          else:
              entry = {}
              if main_cls:
                  entry['main'] = [main_cls]
              if client_cls:
                  entry['client'] = [client_cls]
              data = {
                  'schemaVersion': 1, 'id': modid, 'version': ver, 'name': name,
                  'description': props.get('description', ''),
                  'license': 'MIT', 'environment': '*',
                  'entrypoints': entry,
                  'depends': {'fabricloader': '>=0.16.0', 'minecraft': '~' + mc,
                              'java': '>=' + java, 'fabric-api': '*'}
              }
              json.dump(data, open(fmj, 'w', encoding='utf-8'), indent=2, ensure_ascii=False)

          bg = """plugins { id 'fabric-loom' version '__LOOM__' }
          version = '__VER__'
          base { archivesName = '__MODID__' }
          dependencies {
              minecraft "com.mojang:minecraft:__MC__"
              mappings "net.fabricmc:yarn:__YARN__:v2"
              modImplementation "net.fabricmc:fabric-loader:__LOADER__"
              modImplementation "net.fabricmc.fabric-api:fabric-api:__API__"
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = __JAVA__ }
          java {
              sourceCompatibility = JavaVersion.toVersion(__JAVA__)
              targetCompatibility = JavaVersion.toVersion(__JAVA__)
          }
          """
          bg = '\n'.join(l.strip() if l.strip().startswith(('plugins', 'version', 'base', 'tasks', 'java {', '}')) else '    ' + l.strip() for l in bg.splitlines()) + '\n'
          for k, v in {'__LOOM__': loom, '__VER__': ver, '__MODID__': modid, '__MC__': mc,
                       '__YARN__': yarn, '__LOADER__': loader, '__API__': api_ver, '__JAVA__': java}.items():
              bg = bg.replace(k, v)
          open('out/build.gradle', 'w').write(bg)
          open('out/settings.gradle', 'w').write("pluginManagement {\n    repositories {\n        maven { url = 'https://maven.fabricmc.net/' }\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\n")

          print('Mod:', modid, ver, '| MC', mc, '| yarn', yarn, '| loader', loader, '| api', api_ver, '| java', java)
          print('main =', main_cls, '| client =', client_cls)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as o:
              o.write('modid=%s\n' % modid)
              o.write('jar=%s-%s.jar\n' % (modid, ver))
              o.write('java=%s\n' % java)
              o.write('gradle=%s\n' % gradle)
              o.write('api_url=%s\n' % api_file['url'])
              o.write('api_file=%s\n' % api_file['filename'])
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.prep.outputs.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.prep.outputs.gradle }}

      - name: Compilar
        working-directory: out
        run: gradle build

      - name: Baixar Fabric API
        env:
          API_URL: ${{ steps.prep.outputs.api_url }}
          API_FILE: ${{ steps.prep.outputs.api_file }}
        run: curl -sL "$API_URL" -o "out/build/libs/$API_FILE"

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.prep.outputs.jar }}
          API_FILE: ${{ steps.prep.outputs.api_file }}
          MODID: ${{ steps.prep.outputs.modid }}
        run: |
          gh release create "$MODID-build${{ github.run_number }}" \
            "out/build/libs/$JAR" "out/build/libs/$API_FILE" \
            --repo "${{ github.repository }}" \
            --title "$MODID build ${{ github.run_number }}" \
            --notes "Coloque os dois .jar na pasta mods (Fabric)."
